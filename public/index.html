<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Forge</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #1a1a2e;
      --accent: #0066ff;
      --success: #00c853;
      --danger: #ff3333;
      --warning: #ffb800;
      --bg-light: #f5f7fa;
      --bg-white: #ffffff;
      --text-dark: #1a1a2e;
      --text-light: #666666;
      --border: #e0e0e0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --radius: 8px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    header {
      margin-bottom: 3rem;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #1a1a2e 0%, #0066ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }
    .tagline {
      font-size: 1.1rem;
      color: var(--text-light);
      font-weight: 300;
    }
    section {
      background: var(--bg-white);
      border-radius: var(--radius);
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .input-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 768px) { .input-group { grid-template-columns: 1fr; } }
    input, select {
      padding: 0.875rem 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
      background: var(--bg-white);
      color: var(--text-dark);
    }
    input:hover, select:hover { border-color: var(--accent); }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,102,255,0.1);
    }
    .button-group {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    button {
      padding: 0.875rem 1.75rem;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, #0052cc 100%);
      color: white;
      flex-grow: 1;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,102,255,0.3);
    }
    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 2px solid var(--border);
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger {
      background: var(--danger);
      color: white;
    }
    .btn-danger:hover { background: #cc0000; transform: translateY(-2px); }
    .btn-small { padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 4px; }
    .btn-copy { background: var(--accent); color: white; }
    .btn-copy:hover { background: #0052cc; }
    .btn-delete { background: var(--danger); color: white; }
    .btn-delete:hover { background: #cc0000; }
    .message {
      padding: 1rem;
      border-radius: var(--radius);
      margin-top: 1rem;
      display: none;
      font-weight: 500;
    }
    .message.show { display: block; }
    .message.success { background: rgba(0,200,83,0.1); color: var(--success); border: 1px solid var(--success); }
    .message.error { background: rgba(255,51,51,0.1); color: var(--danger); border: 1px solid var(--danger); }

    .proxy-card {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1.5rem;
      transition: all 0.2s;
    }
    .proxy-card:hover { background: var(--bg-light); }
    .proxy-card:last-child { border-bottom: none; }
    .proxy-info { flex: 1; }
    .proxy-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .proxy-url {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: var(--accent);
      word-break: break-all;
      margin-bottom: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-light);
      border-radius: 4px;
    }
    .proxy-stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-light);
      flex-wrap: wrap;
    }
    .stat-item { display: flex; align-items: center; gap: 0.5rem; }
    .stat-value { font-weight: 600; color: var(--text-dark); }
    .proxy-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--text-light); }
    .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      padding: 2.5rem;
      border-bottom: 1px solid var(--border);
    }
    .stat-card {
      padding: 1.5rem;
      background: var(--bg-light);
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .stat-card h3 { font-size: 0.9rem; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; font-weight: 600; }
    .stat-card p { font-size: 2.5rem; font-weight: 700; color: var(--accent); line-height: 1; }

    .charts-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2rem;
      padding: 2.5rem;
    }
    .chart-wrapper {
      background: var(--bg-light);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 1px solid transparent;
    }
    .chart-wrapper h4 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: var(--text-dark); }
    canvas { max-height: 300px; }

    .loading { text-align: center; padding: 2rem; color: var(--text-light); }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0,102,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; } }
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      section { padding: 1.5rem; }
      .charts-container { grid-template-columns: 1fr; }
      .proxy-card { flex-direction: column; }
      .proxy-actions { width: 100%; }
      .proxy-actions button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Proxy Forge</h1>
      <p class="tagline">Create lightweight reverse proxies instantly. No setup required.</p>
    </header>

    <section>
      <h2>🔗 Create a Proxy</h2>
      <div class="input-group">
        <input type="url" id="originUrl" placeholder="https://example.com" required>
        <input type="text" id="proxyName" placeholder="My Test Site (optional)">
      </div>
      <div class="input-group">
        <select id="methodSelect">
          <option value="A">A – Random alphanumeric (10 chars)</option>
          <option value="B">B – Base36 crypto random (10 chars)</option>
          <option value="C">C – Encrypted URL (long, self-contained)</option>
          <option value="D">D – Hash of URL + salt (12 hex chars)</option>
          <option value="E" selected>E – Crypto base64url (10 chars) ★ recommended</option>
        </select>
        <div></div>
      </div>
      <div class="button-group">
        <button class="btn-primary" onclick="generateProxy()">Generate Link</button>
      </div>
      <div id="message" class="message"></div>
    </section>

    <section class="proxies-section">
      <h2>📋 Your Proxies</h2>
      <div id="proxyList" class="loading"><div class="spinner"></div> Loading proxies...</div>
    </section>

    <section class="stats-section">
      <div class="stats-header" style="display: flex; justify-content: space-between; align-items: center; padding: 2.5rem 2.5rem 0;">
        <h2>📊 Statistics</h2>
        <button class="btn-danger btn-small" onclick="resetStats()">Reset All Stats</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card"><h3>Total Clicks</h3><p id="totalClicks">0</p></div>
        <div class="stat-card"><h3>Unique Visitors</h3><p id="uniqueVisitors">0</p></div>
      </div>
      <div class="charts-container">
        <div class="chart-wrapper"><h4>Traffic by Country</h4><canvas id="countryChart"></canvas></div>
        <div class="chart-wrapper"><h4>Traffic by Device</h4><canvas id="deviceChart"></canvas></div>
        <div class="chart-wrapper"><h4>Traffic by Browser</h4><canvas id="browserChart"></canvas></div>
        <div class="chart-wrapper"><h4>Last 24 Hours</h4><canvas id="trafficChart"></canvas></div>
      </div>
    </section>
  </div>

  <script>
    let visitorId = getOrCreateVisitorId();
    let refreshInterval = null;

    function getOrCreateVisitorId() {
      let id = localStorage.getItem('visitorId');
      if (!id) {
        id = 'visitor_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitorId', id);
      }
      return id;
    }

    function showMessage(text, type = 'success', duration = 3000) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = `message show ${type}`;
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showMessage('✓ Copied to clipboard!', 'success', 2000);
      }).catch(() => showMessage('Failed to copy', 'error'));
    }

    async function generateProxy() {
      const originUrl = document.getElementById('originUrl').value;
      const proxyName = document.getElementById('proxyName').value || originUrl;
      const method = document.getElementById('methodSelect').value;

      if (!originUrl) {
        showMessage('Please enter a URL', 'error');
        return;
      }

      try {
        const response = await fetch('/api/proxies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origin_url: originUrl, name: proxyName, method }),
        });
        const data = await response.json();
        if (!response.ok) {
          showMessage(data.error || 'Failed to create proxy', 'error');
          return;
        }
        showMessage(`✓ Proxy created: ${data.proxy_url}`, 'success');
        document.getElementById('originUrl').value = '';
        document.getElementById('proxyName').value = '';
        setTimeout(loadProxies, 500);
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    async function deleteProxy(id) {
      if (!confirm('Delete this proxy? This cannot be undone.')) return;
      try {
        const response = await fetch(`/api/proxies/${id}`, { method: 'DELETE' });
        if (response.ok) {
          showMessage('✓ Proxy deleted', 'success');
          loadProxies();
        } else {
          showMessage('Failed to delete proxy', 'error');
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    async function loadProxies() {
      try {
        const response = await fetch('/api/proxies');
        const proxies = await response.json();
        const proxyList = document.getElementById('proxyList');
        if (proxies.length === 0) {
          proxyList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🔗</div><p>No proxies yet. Create one to get started!</p></div>`;
          return;
        }
        proxyList.innerHTML = proxies.map(p => `
          <div class="proxy-card">
            <div class="proxy-info">
              <div class="proxy-name">${escapeHtml(p.name)}</div>
              <div class="proxy-url">${window.location.origin}/${p.id}</div>
              <div class="proxy-stats">
                <span class="stat-item">Clicks: <span class="stat-value">${p.total_clicks}</span></span>
                <span class="stat-item">Unique: <span class="stat-value">${p.unique_visitors}</span></span>
                ${p.last_accessed ? `<span class="stat-item">Last: <span class="stat-value">${formatTime(p.last_accessed)}</span></span>` : ''}
              </div>
            </div>
            <div class="proxy-actions">
              <button class="btn-small btn-copy" onclick="copyToClipboard('${window.location.origin}/${p.id}')">Copy</button>
              <button class="btn-small btn-delete" onclick="deleteProxy('${p.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('proxyList').innerHTML = `<div class="empty-state" style="color: var(--danger);">Failed to load proxies: ${error.message}</div>`;
      }
    }

    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        document.getElementById('totalClicks').textContent = stats.total_clicks;
        document.getElementById('uniqueVisitors').textContent = stats.unique_visitors;
        updateCountryChart(stats.by_country);
        updateDeviceChart(stats.by_device);
        updateBrowserChart(stats.by_browser);
        updateTrafficChart(stats.last_24h);
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    async function resetStats() {
      if (!confirm('Are you sure you want to reset ALL statistics? This cannot be undone.')) return;
      try {
        const response = await fetch('/api/stats/reset', { method: 'POST' });
        const data = await response.json();
        if (response.ok) {
          showMessage('✅ All statistics have been reset.', 'success', 3000);
          loadStats();
          loadProxies();
        } else {
          showMessage('Failed to reset stats: ' + (data.error || 'unknown error'), 'error');
        }
      } catch (error) {
        showMessage('Error: ' + error.message, 'error');
      }
    }

    let charts = {};
    function updateCountryChart(data) {
      const ctx = document.getElementById('countryChart').getContext('2d');
      const labels = Object.keys(data).slice(0, 8);
      const values = labels.map(k => data[k]);
      if (charts.country) charts.country.destroy();
      charts.country = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: ['#0066ff','#00c853','#ffb800','#ff3333','#9c27b0','#00bcd4','#ff6f00','#607d8b'], borderWidth: 0 }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }
    function updateDeviceChart(data) {
      const ctx = document.getElementById('deviceChart').getContext('2d');
      const labels = Object.keys(data);
      const values = labels.map(k => data[k]);
      if (charts.device) charts.device.destroy();
      charts.device = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: ['#0066ff','#00c853','#ffb800'], borderWidth: 0 }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }
    function updateBrowserChart(data) {
      const ctx = document.getElementById('browserChart').getContext('2d');
      const labels = Object.keys(data);
      const values = labels.map(k => data[k]);
      if (charts.browser) charts.browser.destroy();
      charts.browser = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: ['#0066ff','#00c853','#ffb800','#ff3333','#9c27b0'], borderWidth: 0 }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }
    function updateTrafficChart(data) {
      const ctx = document.getElementById('trafficChart').getContext('2d');
      const labels = data.map(d => `${d.hour}:00`);
      const values = data.map(d => d.clicks);
      if (charts.traffic) charts.traffic.destroy();
      charts.traffic = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Clicks',
            data: values,
            borderColor: '#0066ff',
            backgroundColor: 'rgba(0,102,255,0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#0066ff'
          }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function formatTime(timestamp) {
      const date = new Date(timestamp);
      const diff = Date.now() - date.getTime();
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
      if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
      return Math.floor(diff / 86400000) + 'd ago';
    }

    async function init() {
      loadProxies();
      loadStats();
      refreshInterval = setInterval(loadStats, 5000);
      document.getElementById('originUrl').addEventListener('keypress', e => { if (e.key === 'Enter') generateProxy(); });
      document.getElementById('proxyName').addEventListener('keypress', e => { if (e.key === 'Enter') generateProxy(); });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    window.addEventListener('beforeunload', () => {
      if (refreshInterval) clearInterval(refreshInterval);
    });
  </script>
</body>
</html>
